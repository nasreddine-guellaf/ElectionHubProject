name: electionhub

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    APP_ENV: local
    SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
    CITIZEN_OTP_ENABLED: ${CITIZEN_OTP_ENABLED:-false}
    OTP_HMAC_KEY: ${OTP_HMAC_KEY:-}
    MOCK_SMS_DIRECTORY: /tmp/electionhub-sms
    OBJECT_STORAGE_BACKEND: ${OBJECT_STORAGE_BACKEND:-local}
    LOCAL_OBJECT_DIRECTORY: /var/lib/electionhub/objects
    OBJECT_UPLOAD_MAX_BYTES: ${OBJECT_UPLOAD_MAX_BYTES:-10485760}
    AWS_REGION: ${AWS_REGION:-eu-west-3}
    S3_BUCKET: ${S3_BUCKET:-}
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER:-electionhub}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    POSTGRES_DB: ${POSTGRES_DB:-electionhub}

services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-electionhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-electionhub}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  object-init:
    <<: *backend
    user: "0:0"
    command: ["sh", "-c", "chown -R appuser:appuser /var/lib/electionhub/objects && chmod 700 /var/lib/electionhub/objects"]
    volumes:
      - object_data:/var/lib/electionhub/objects

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - object_data:/var/lib/electionhub/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  object_data:
